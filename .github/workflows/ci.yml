name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest, ruff, pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff — syntax errors / undefined names / unused imports)
        run: ruff check . --select E9,F

      - name: Test (pytest)
        run: pytest -q

      - name: Dependency security audit (pip-audit)
        # Informational: transitive-dependency CVEs can appear outside our control.
        # Findings are surfaced in the log without blocking merges.
        continue-on-error: true
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (vitest, eslint, npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (vitest)
        run: npm run test

      - name: Build (vite)
        run: npm run build

      - name: Dependency security audit (npm audit)
        # Informational: same rationale as the backend's pip-audit step.
        continue-on-error: true
        run: npm audit --audit-level=high

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build docker-compose images
        run: docker-compose build
